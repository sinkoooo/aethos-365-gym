<!DOCTYPE html>
<html>
<head>
    <style>
        body { width: 300px; padding: 10px; font-family: sans-serif; }
        .mode-btn { width: 100%; padding: 10px; margin: 5px 0; cursor: pointer; border: none; border-radius: 4px;}
        #btn-record { background-color: #ff4757; color: white; }
        #btn-play { background-color: #2ed573; color: white; }
        .status { margin-top: 10px; font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <h3>USM Assistant</h3>
    <p>Select Mode:</p>
    <button id="btn-record" class="mode-btn">Start Mapping Mode (Expert)</button>
    <button id="btn-play" class="mode-btn">Start Chat Mode (Operator)</button>
    <div id="chat-container" style="display:none; margin-top: 15px;">
        <input type="text" id="chat-input" style="width: 100%; padding: 5px;" placeholder="What do you need?">
        <button id="btn-send" style="width: 100%; margin-top: 5px; padding: 5px;">Ask AI</button>
        <p><i>Ensure local Python server is running on port 8000</i></p>
    </div>
    <div class="status" id="status-text">Idle</div>
    <script src="popup.js"></script>
</body>
</html>
